openapi: 3.0.3
info:
  title: Foodware API — Autenticación y sesión
  version: 1.0.0
  description: >
    Contrato de login, sesión y logout de la historia 000. La sesión se transporta en una cookie
    HttpOnly; no se aceptan cabeceras, variables de entorno ni parámetros de URL como identidad.
servers:
  - url: /api
paths:
  /auth/login:
    post:
      summary: Inicia sesión con usuario y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, password]
              properties:
                usuario:
                  type: string
                  description: Identificador del usuario.
                password:
                  type: string
                  format: password
                  description: Contraseña; nunca se registra ni se devuelve.
      responses:
        "200":
          description: >
            Sesión creada. La respuesta incluye la cookie de sesión HttpOnly y los datos públicos
            del usuario.
          headers:
            Set-Cookie:
              description: >
                Cookie de sesión HttpOnly, SameSite=Lax; Secure en producción. El token no es
                legible por JavaScript.
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioSesion" }
        "400":
          description: Faltan usuario o contraseña.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: >
            Credenciales incorrectas. El mismo mensaje se usa para usuario inexistente y contraseña
            incorrecta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/me:
    get:
      summary: Devuelve el usuario y rol de la sesión actual
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioSesion" }
        "401":
          description: Sin sesión válida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      summary: Cierra la sesión actual
      security:
        - cookieAuth: []
      responses:
        "204":
          description: >
            Sesión invalidada y cookie eliminada. Es idempotente: si la sesión ya no existía,
            también devuelve 204.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: foodware_session
  schemas:
    UsuarioSesion:
      type: object
      required: [id, nombre, rol, partida]
      properties:
        id: { type: string }
        nombre: { type: string }
        rol:
          type: string
          enum: [camarero, cocinero, encargado, administrador]
        partida:
          type: string
          enum: [entrantes, principales, postres]
          nullable: true
          description: Solo para cocineros; null si no tiene partida.
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string }
        mensaje:
          type: string
          description: Mensaje en español de España.
