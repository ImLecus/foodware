openapi: 3.0.3
info:
  title: Foodware — API de pedidos (historia 001)
  version: 1.0.0
  description: >
    Contrato de la API necesaria para abrir una mesa, tomar el pedido plato a plato, agruparla por
    partidas y confirmarla. Los importes se expresan en céntimos enteros. Todas las peticiones
    requieren la identificación del camarero (sesión existente; ver research.md §8).

servers:
  - url: /api

paths:
  /mesas:
    get:
      summary: Lista las mesas con su estado
      operationId: listarMesas
      responses:
        '200':
          description: Lista de mesas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mesa' }

  /mesas/{mesaId}/abrir:
    post:
      summary: Abre una mesa (la marca ocupada e inicia el pedido)
      operationId: abrirMesa
      parameters:
        - $ref: '#/components/parameters/mesaId'
      responses:
        '201':
          description: Pedido en curso creada para la mesa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '409':
          description: La mesa ya tiene un pedido en curso (FR-005)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /platos:
    get:
      summary: Devuelve la carta vigente (platos disponibles)
      operationId: listarPlatos
      responses:
        '200':
          description: Platos disponibles de la carta
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plato' }

  /pedidos/{pedidoId}:
    get:
      summary: Devuelve un pedido con sus líneas agrupadas por partidas
      operationId: obtenerPedido
      parameters:
        - $ref: '#/components/parameters/pedidoId'
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '404':
          description: Pedido no encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pedidos/{pedidoId}/lineas:
    post:
      summary: Añade un plato al pedido en curso
      operationId: anadirLinea
      parameters:
        - $ref: '#/components/parameters/pedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaLinea' }
      responses:
        '201':
          description: Línea creada (con el precio fijado en el momento de pedir)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineaPedido' }
        '400':
          description: Datos inválidos (p. ej. cantidad < 1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: El pedido no está en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pedidos/{pedidoId}/lineas/{lineaId}:
    patch:
      summary: Modifica la cantidad de una línea
      operationId: modificarLinea
      parameters:
        - $ref: '#/components/parameters/pedidoId'
        - $ref: '#/components/parameters/lineaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineaPatch' }
      responses:
        '200':
          description: Línea actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineaPedido' }
        '409':
          description: El pedido no está en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Retira un plato del pedido en curso
      operationId: retirarLinea
      parameters:
        - $ref: '#/components/parameters/pedidoId'
        - $ref: '#/components/parameters/lineaId'
      responses:
        '204':
          description: Línea retirada
        '409':
          description: El pedido no está en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pedidos/{pedidoId}/confirmar:
    post:
      summary: Confirma el pedido y devuelve el pedido agrupado por partidas
      operationId: confirmarPedido
      parameters:
        - $ref: '#/components/parameters/pedidoId'
      responses:
        '200':
          description: Pedido enviado con el pedido agrupado por partidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoConfirmado' }
        '409':
          description: No se puede confirmar (pedido vacío o ya enviado) (FR-014)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /eventos:
    get:
      summary: Suscripción SSE a eventos de estado (tiempo real, hub compartido)
      operationId: eventos
      responses:
        '200':
          description: Stream `text/event-stream` con eventos de pedido (confirmado, modificado, actualizado)
          content:
            text/event-stream:
              schema: { type: string }

components:
  parameters:
    mesaId:
      name: mesaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    pedidoId:
      name: pedidoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    lineaId:
      name: lineaId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Partida:
      type: string
      enum: [entrantes, principales, postres]

    Mesa:
      type: object
      required: [id, identificador, estado]
      properties:
        id: { type: string, format: uuid }
        identificador: { type: string, example: 'Mesa 5' }
        estado: { type: string, enum: [libre, ocupada] }
        pedido_en_curso_id: { type: string, format: uuid, nullable: true }

    Plato:
      type: object
      required: [id, nombre, partida, precio_centimos, disponible]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        partida: { $ref: '#/components/schemas/Partida' }
        precio_centimos: { type: integer, minimum: 1 }
        disponible: { type: boolean }

    LineaPedido:
      type: object
      required: [id, plato_id, cantidad, precio_centimos, partida]
      properties:
        id: { type: string, format: uuid }
        plato_id: { type: string, format: uuid }
        plato_nombre: { type: string }
        cantidad: { type: integer, minimum: 1 }
        precio_centimos: { type: integer, minimum: 1 }
        partida: { $ref: '#/components/schemas/Partida' }

    Pedido:
      type: object
      required: [id, mesa_id, estado, creada_en, lineas]
      properties:
        id: { type: string, format: uuid }
        mesa_id: { type: string, format: uuid }
        camarero_id: { type: string }
        estado: { type: string, enum: [en_curso, enviada] }
        creada_en: { type: string, format: date-time }
        confirmada_en: { type: string, format: date-time, nullable: true }
        lineas:
          type: array
          items: { $ref: '#/components/schemas/LineaPedido' }
        por_partida:
          $ref: '#/components/schemas/PedidoPorPartida'

    PedidoPorPartida:
      type: object
      description: Líneas agrupadas por partida (FR-010, FR-016)
      properties:
        entrantes: { type: array, items: { $ref: '#/components/schemas/LineaPedido' } }
        principales: { type: array, items: { $ref: '#/components/schemas/LineaPedido' } }
        postres: { type: array, items: { $ref: '#/components/schemas/LineaPedido' } }

    PedidoConfirmado:
      type: object
      required: [pedido_id, mesa, confirmada_en, por_partida]
      properties:
        pedido_id: { type: string, format: uuid }
        mesa: { $ref: '#/components/schemas/Mesa' }
        confirmada_en: { type: string, format: date-time }
        por_partida: { $ref: '#/components/schemas/PedidoPorPartida' }

    NuevaLinea:
      type: object
      required: [plato_id, cantidad]
      properties:
        plato_id: { type: string, format: uuid }
        cantidad: { type: integer, minimum: 1, default: 1 }

    LineaPatch:
      type: object
      minProperties: 1
      properties:
        cantidad: { type: integer, minimum: 1 }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detalle: { type: string, nullable: true }
